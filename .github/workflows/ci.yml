name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.4.7', '9.6.6', '9.8.4', '9.10.2', '9.12.1']
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-
      - name: Update index
        run: cabal update
      - name: Build
        run: cabal build all --enable-tests --enable-benchmarks
      - name: Test
        run: cabal test all --test-show-details=direct
      - name: Bench (quick)
        run: cabal bench all --benchmark-options='--time-limit=1 --resamples=10'

  bench:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.12.1'
          cabal-version: 'latest'
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-bench-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-bench-
      - name: Update index
        run: cabal update
      - name: Build benchmarks
        run: cabal build figment:bench:figment-bench
      - name: Run benchmarks
        run: |
          mkdir -p bench-results
          cabal bench figment:bench:figment-bench \
            --benchmark-options='--json bench-results/current.json'
      - name: Download baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-baseline
          path: bench-results
      - name: Compare against baseline
        if: hashFiles('bench-results/baseline.json') != ''
        run: |
          echo "Baseline present. Comparison is manual until thresholds are calibrated."
          echo "See ADR 011."
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: bench-result-${{ github.sha }}
          path: bench-results/current.json
      - name: Promote to baseline on main
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: bench-results/current.json
          overwrite: true
